[workspace]
resolver = "2"
members = ["crates/apex-edit", "crates/apex-core", "crates/apex-server", "crates/apex-client", "crates/apex-cli",
    "crates/apex-tool-win",
    "crates/apex-tool-lsp",
    "crates/apex-tool-preview",
    "crates/apex-tool",
    "crates/apex-tool-bridge"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[patch.crates-io]
pathfinder_simd = { path = "third_party/pathfinder_simd" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
