[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
description = "the apex command: sessions, attaching, and the control protocol for scripts and tools"

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
apex-core = { path = "../apex-core" }
apex-server = { path = "../apex-server" }
apex-tool-win = { path = "../apex-tool-win" }
apex-tool-lsp = { path = "../apex-tool-lsp" }
apex-tool-preview = { path = "../apex-tool-preview" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
apex-edit = { path = "../apex-edit" }
serde_json = "1"
