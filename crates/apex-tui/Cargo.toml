[package]
name = "apex-tui"
version.workspace = true
edition.workspace = true
description = "apex TUI view server: attaches to a session and serves a cell-grid view model to the TermKit UI"

[[bin]]
name = "apex-tuid"
path = "src/main.rs"

[dependencies]
apex-core = { path = "../apex-core" }
apex-server = { path = "../apex-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
