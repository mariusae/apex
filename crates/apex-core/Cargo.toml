[package]
name = "apex-core"
version.workspace = true
edition.workspace = true
description = "apex editor core: buffers, views, the replicated state machine, and the Edit language"

[dependencies]
ropey = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
