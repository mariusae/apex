[package]
name = "apex-core"
version.workspace = true
edition.workspace = true
description = "apex editor core: buffers, views, the replicated state machine, logs, leases, and built-in commands"

[dependencies]
apex-edit = { path = "../apex-edit" }
ropey = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = { version = "1", features = ["pure"] } # no C or assembly: cross-compiles anywhere
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "core"
harness = false
